<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-label="Natural QCC current architecture">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, 'Noto Sans CJK SC', sans-serif; fill: #475569; }
      .box-title { font: 700 19px Arial, 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
      .box-text { font: 400 15px Arial, 'Noto Sans CJK SC', sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, 'Noto Sans CJK SC', sans-serif; fill: #475569; }
      .tag { font: 700 13px Arial, 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .data { fill: #e0f2fe; stroke: #0284c7; }
      .verify { fill: #dcfce7; stroke: #16a34a; }
      .review { fill: #fef3c7; stroke: #d97706; }
      .train { fill: #ede9fe; stroke: #7c3aed; }
      .model { fill: #fce7f3; stroke: #db2777; }
      .eval { fill: #fee2e2; stroke: #dc2626; }
      .note { fill: #f8fafc; stroke: #94a3b8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#f8fafc"/>
  <text x="70" y="70" class="title">当前 Natural QCC 架构图</text>
  <text x="70" y="104" class="subtitle">核心思想：模型不直接猜答案，而是先生成“能回答当前问题的自然语言证据 caption”，再用 QA/槽位审计验证它是否可信。</text>

  <rect x="70" y="150" width="190" height="160" class="panel data"/>
  <text x="92" y="184" class="box-title">1. 时序来源</text>
  <text x="92" y="218" class="box-text">Grid2Op 电网</text>
  <text x="92" y="244" class="box-text">CityLearn 建筑能耗</text>
  <text x="92" y="270" class="box-text">Traffic / Water</text>
  <text x="92" y="296" class="box-text">AIOpsLab / FinRL</text>

  <rect x="315" y="150" width="215" height="160" class="panel verify"/>
  <text x="337" y="184" class="box-title">2. 确定性证据</text>
  <text x="337" y="218" class="box-text">从 trace / simulator</text>
  <text x="337" y="244" class="box-text">计算 support slots</text>
  <text x="337" y="270" class="box-text">趋势、极值、波动、</text>
  <text x="337" y="296" class="box-text">反事实、相关、阈值规则</text>

  <rect x="585" y="150" width="235" height="160" class="panel review"/>
  <text x="607" y="184" class="box-title">3. Natural QA 改写</text>
  <text x="607" y="218" class="box-text">Scene 交代业务背景</text>
  <text x="607" y="244" class="box-text">Question 像正常提问</text>
  <text x="607" y="270" class="box-text">Options 双语可读</text>
  <text x="607" y="296" class="box-text">Evidence 仍由 slots 验证</text>

  <rect x="875" y="150" width="205" height="160" class="panel review"/>
  <text x="897" y="184" class="box-title">4. Reviewer gate</text>
  <text x="897" y="218" class="box-text">GPT-5.5 只做质检</text>
  <text x="897" y="244" class="box-text">自然性、可答性、风险</text>
  <text x="897" y="270" class="box-text">不决定 gold answer</text>
  <text x="897" y="296" class="box-text">高风险样本剔除</text>

  <rect x="1135" y="150" width="205" height="160" class="panel train"/>
  <text x="1157" y="184" class="box-title">5. SFT 资产</text>
  <text x="1157" y="218" class="box-text">train/dev/test</text>
  <text x="1157" y="244" class="box-text">q-conditioned prompt</text>
  <text x="1157" y="270" class="box-text">no-question control</text>
  <text x="1157" y="296" class="box-text">token-budget preflight</text>

  <path d="M260 230 H315" class="arrow"/>
  <path d="M530 230 H585" class="arrow"/>
  <path d="M820 230 H875" class="arrow"/>
  <path d="M1080 230 H1135" class="arrow"/>

  <rect x="150" y="410" width="1090" height="260" class="panel model"/>
  <text x="178" y="448" class="box-title">6. Question-conditioned evidence captioner（当前训练线）</text>

  <rect x="190" y="492" width="220" height="112" class="panel data"/>
  <text x="214" y="526" class="box-title">时序输入</text>
  <text x="214" y="558" class="box-text">values / raw compact values</text>
  <text x="214" y="584" class="box-text">多变量窗口</text>

  <rect x="465" y="492" width="225" height="112" class="panel train"/>
  <text x="489" y="526" class="box-title">TS encoder + bridge</text>
  <text x="489" y="558" class="box-text">把时序压成 prefix</text>
  <text x="489" y="584" class="box-text">接到语言模型前缀</text>

  <rect x="745" y="492" width="220" height="112" class="panel review"/>
  <text x="769" y="526" class="box-title">文本条件</text>
  <text x="769" y="558" class="box-text">scene + variables</text>
  <text x="769" y="584" class="box-text">downstream question</text>

  <rect x="1015" y="492" width="185" height="112" class="panel model"/>
  <text x="1039" y="526" class="box-title">LLM captioner</text>
  <text x="1039" y="558" class="box-text">Qwen3-4B 路线</text>
  <text x="1039" y="584" class="box-text">输出证据 caption</text>

  <path d="M410 548 H465" class="arrow"/>
  <path d="M690 548 H745" class="arrow"/>
  <path d="M965 548 H1015" class="arrow"/>

  <rect x="235" y="705" width="240" height="102" class="panel eval"/>
  <text x="257" y="738" class="box-title">QA 检验</text>
  <text x="257" y="768" class="box-text">caption 能否让 QA 答对</text>
  <text x="257" y="792" class="small">semantic QA / answer accuracy</text>

  <rect x="570" y="705" width="260" height="102" class="panel eval"/>
  <text x="592" y="738" class="box-title">事实性检验</text>
  <text x="592" y="768" class="box-text">数字、方向、窗口、阈值</text>
  <text x="592" y="792" class="small">slot factuality / hallucination audit</text>

  <rect x="925" y="705" width="240" height="102" class="panel eval"/>
  <text x="947" y="738" class="box-title">对照检验</text>
  <text x="947" y="768" class="box-text">q-conditioned vs no-question</text>
  <text x="947" y="792" class="small">证明问题条件是否真的有用</text>

  <path d="M1108 604 C1108 655 355 655 355 705" class="arrow"/>
  <path d="M1108 604 C1108 655 700 655 700 705" class="arrow"/>
  <path d="M1108 604 C1108 655 1045 655 1045 705" class="arrow"/>

  <rect x="70" y="338" width="1270" height="44" class="panel note"/>
  <text x="96" y="366" class="tag">关键约束：</text>
  <text x="178" y="366" class="small">LLM 可以改写语言、评审自然性，但 gold answer 和 evidence slot 必须来自确定性计算；训练前必须确认 target caption 真的进入 loss。</text>
</svg>
